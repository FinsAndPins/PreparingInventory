    const bi = Number(p.board_index);
    if (bn && Number.isFinite(bi) && bi > 0 && m[bn] == null) m[bn] = Math.trunc(bi);
  }
  let n = 0;
  for (const p of PINS) {
    const bn = String(p.board_num || '');
    if (bn && m[bn] == null) m[bn] = ++n;
  }
  return m;
})();
function boardOrdinal(p) {
  const bi = Number(p && p.board_index);
  if (Number.isFinite(bi) && bi > 0) return String(Math.trunc(bi));
  const n = BOARD_ORD[String(p && p.board_num || '')];
  return n ? String(n) : '?';
}
function boardPinLabel(p) {
  return 'Board ' + boardOrdinal(p) + ' · Pin ' + (p && p.pin_n != null ? p.pin_n : '?');
}
function overlayPriceText(p) {
  const v = roundMoney(p.price);
  if (!v) return '?';
  return String(v);
}

const _DB_BASE = (FB_CFG && FB_CFG.databaseURL)
  ? String(FB_CFG.databaseURL).replace(/\/+$/, '')
  : 'https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com';

async function _fbReadAllPins() {
  const url = _DB_BASE + '/pin_pricing_tests/' + TEST_RUN_ID + '/' + APPROACH_ID + '/pins.json';
  try {
    const resp = await fetch(url);
    if (!resp.ok) { console.warn('Firebase read HTTP ' + resp.status); return {}; }
    return (await resp.json()) || {};
  } catch (e) {
    console.warn('Firebase read failed', e);
    return {};
  }
}

function applyFirebase(fbPins) {
  if (!fbPins) return;
  const byPk = {};
  for (const rec of Object.values(fbPins)) {
    if (!rec || !rec.pin_key) continue;
    byPk[rec.pin_key] = rec;
  }
  for (const p of PINS) {
    const rec = byPk[p.pk];
    if (!rec) continue;
    if (rec.display_price != null && Number.isFinite(Number(rec.display_price))) {
      const raw = Number(rec.display_price);
      // Match CTR 20260910 list badge: min $10, ceil to $5.
      p.price = (!raw || raw <= 0) ? 0 : (raw < 10 ? 10 : Math.ceil(raw / 5) * 5);
    }
    if (rec.match_status) p.ms = rec.match_status;
    if (rec.not_a_pin === true) p.ms = 'not_a_pin';
  }
}

function render() {
  const jump = document.getElementById('jump-bar');
  const root = document.getElementById('sections');
  const countEl = document.getElementById('hdr-count');
  jump.replaceChildren();
  root.replaceChildren();

  const groups = {};
  for (const b of BANDS) groups[b.id] = [];
  let shown = 0;
  for (const p of PINS) {
    if (isNotAPin(p)) continue;
    const id = bandIdFor(p.price);
    if (!groups[id]) groups[id] = [];
    groups[id].push(p);
    shown++;
  }
  for (const id of Object.keys(groups)) {
    groups[id].sort((a, b) => {
      const da = Number(BOARD_ORD[String(a.board_num)] || 9999);
      const db = Number(BOARD_ORD[String(b.board_num)] || 9999);
      if (da !== db) return da - db;
      return (a.pin_n || 0) - (b.pin_n || 0);
    });
  }

  countEl.textContent = shown + ' pins';
  document.getElementById('boot-empty').hidden = shown > 0;

  for (const b of BANDS) {
    const list = groups[b.id] || [];
    const chip = document.createElement('a');
    chip.className = 'jb' + (list.length ? '' : ' empty');
    chip.href = '#band-' + b.id;
    chip.innerHTML = b.label + '<span class="n">' + list.length + '</span>';
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      const el = document.getElementById('band-' + b.id);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
    jump.appendChild(chip);

    const sec = document.createElement('section');
    sec.className = 'section' + (list.length ? '' : ' hidden');
    sec.id = 'band-' + b.id;
    const sum = list.reduce((a, p) => a + roundMoney(p.price), 0);
    const h = document.createElement('div');
    h.className = 'sec-h';
    const title = document.createElement('h2');
    title.textContent = b.label;
    const meta = document.createElement('div');
    meta.className = 'sec-meta';
    if (b.id === 'unpriced') {
      meta.textContent = list.length + ' pins';
    } else {
      meta.textContent = list.length + ' pins · $' + sum;
    }
    h.append(title, meta);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const p of list) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pk = p.pk;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = p.crop ? (CROP_BASE + encodeURIComponent(p.crop)) : '';
      img.alt = '';
      const pr = document.createElement('div');
      pr.className = 'price';
      pr.textContent = overlayPriceText(p);
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = boardPinLabel(p);
      card.append(img, pr, tag);
      card.addEventListener('click', () => {
        window.location.href = 'new_ctp.html?filter=all&pin=' + encodeURIComponent(p.pk);
      });
      grid.appendChild(card);
    }
    sec.append(h, grid);
    root.appendChild(sec);
  }
}

render();
(async function hydrate() {
  const fbPins = await _fbReadAllPins();
  const keys = Object.keys(fbPins || {});
  if (!keys.length) {
    console.log('Price groups: no Firebase data for this run');
    return;
  }
  applyFirebase(fbPins);
  render();
  console.log('Price groups: hydrated ' + keys.length + ' Firebase records');
})();
</script>
</body>
