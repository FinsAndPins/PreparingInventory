// ── Firebase REST API ─────────────────────────────────────────────────────────
const _DB_BASE = 'https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com';
function _fbUrl(path) {
  return _DB_BASE + '/' + path + '.json';
}
function _fbPatch(path, data) {
  return fetch(_fbUrl(path), {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(function(r) {
    if (!r.ok) console.warn('Firebase write HTTP', r.status);
  }).catch(function(e) {
    console.warn('Firebase write failed', e);
  });
}

// ── Reviewer name (persisted in localStorage) ─────────────────────────────────
function _getUser() {
  let u = localStorage.getItem('fpins_reviewer');
  if (!u) {
    u = (window.prompt('Your name (saved for review records):') || '').trim().slice(0, 30);
    if (u) localStorage.setItem('fpins_reviewer', u);
    else u = 'unknown';
  }
  return u;
}

// ── State ─────────────────────────────────────────────────────────────────────
const rejected  = new Set();
const writtenFb = new Set(); // keys already written to Firebase (as rejected)
let undoTimer   = null;
let undoKey     = null;
let sortMode    = 'price';
let confirmed   = false;

// ── Hydrate from Firebase on load ─────────────────────────────────────────────
// Removes already-reviewed pins from ALL_PINS on page load.
// RTDB keys have dots converted to underscores, so we must look up by mangled key.
// A pin is "done" if: auto_match_review is confirmed/rejected OR match_status is match/no_match.
(async function hydrateFromFirebase() {
  try {
    const resp = await fetch(_fbUrl('pin_pricing_tests/' + TEST_RUN_ID + '/' + APPROACH_ID + '/pins'));
    if (!resp.ok) return;
    const fbPins = (await resp.json()) || {};
    const DONE_MS = new Set(['match', 'no_match', 'priced']);
    let alreadyDone = 0;
    for (let i = ALL_PINS.length - 1; i >= 0; i--) {
      const pin = ALL_PINS[i];
      // RTDB converts dots in keys to underscores
      const rtdbKey = pin.pin_key.replace(/\./g, '_');
      const fbPin = fbPins[rtdbKey];
      if (!fbPin) continue;
      const rev = fbPin.auto_match_review;
      const ms  = fbPin.match_status;
      if (rev === 'confirmed' || rev === 'rejected' || DONE_MS.has(ms)) {
        ALL_PINS.splice(i, 1);
        alreadyDone++;
      }
    }
    if (alreadyDone > 0) {
      console.log('Hydrated: removed ' + alreadyDone + ' already-reviewed pins');
      render();
    }
  } catch(e) { console.warn('Firebase hydration failed', e); }
})();

// ── CSS.escape polyfill (iOS Safari <14 safety) ───────────────────────────────
function esc(s) {
  return (typeof CSS !== 'undefined' && CSS.escape) ? CSS.escape(s)
    : s.replace(/[!"#$%&'()*+,./:;<=>?@[\\]^`{|}~]/g,'\$&').replace(/\s/g,'\$&');
}

// ── Sort + render ─────────────────────────────────────────────────────────────
function sorted() {
  const p = ALL_PINS.slice();
  if (sortMode === 'price')    p.sort((a,b) => (b.price||0)-(a.price||0));
  if (sortMode === 'sim_desc') p.sort((a,b) => (b.auto_sim||0)-(a.auto_sim||0));
  if (sortMode === 'sim_asc')  p.sort((a,b) => (a.auto_sim||0)-(b.auto_sim||0));
  return p;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const pin of sorted()) list.appendChild(makeCard(pin));
  updateCounter();
}

function makeCard(pin) {
  const wrap = document.createElement('div');
  wrap.className = 'cw';
  wrap.id = 'w-' + esc(pin.pin_key);
  wrap.style.height = '160px';

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'c-' + esc(pin.pin_key);

  // Image pair
  const imgs = document.createElement('div');
  imgs.className = 'imgs';

  const lb = document.createElement('div'); lb.className = 'ibox';
  const li = document.createElement('img');
  li.src = pin.b64 || ('../crops/' + encodeURIComponent(pin.crop_filename));
  li.loading = 'lazy'; li.alt = 'pin';
  if (!pin.b64) li.onerror = function(){ this.src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzIyMiIvPjx0ZXh0IHg9IjYwIiB5PSI2OCIgZm9udC1zaXplPSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzU1NSI+PzwvdGV4dD48L3N2Zz4="; this.onerror=null; };
  lb.appendChild(li);

  const rb = document.createElement('div'); rb.className = 'ibox';
  const ri = document.createElement('img');
  ri.src = pin.thumb_url; ri.loading = 'lazy'; ri.alt = 'eBay';
  rb.appendChild(ri);

  imgs.appendChild(lb); imgs.appendChild(rb);

  // Reject button
  const xb = document.createElement('div');
  xb.className = 'x-btn';
  xb.textContent = '✕';
  xb.addEventListener('click', function(e){ e.stopPropagation(); rejectPin(pin.pin_key); });

  // Undo overlay
  const ub = document.createElement('div');
  ub.className = 'undo-bar';
  ub.id = 'u-' + esc(pin.pin_key);
  const ubLabel = document.createElement('span');
  ubLabel.textContent = 'Removed';
  const ubBtn = document.createElement('button');
  ubBtn.className = 'undo-btn';
  ubBtn.textContent = 'Undo';
  ubBtn.addEventListener('click', function(){ undoReject(pin.pin_key); });
  ub.appendChild(ubLabel); ub.appendChild(ubBtn);

  card.appendChild(imgs);
  card.appendChild(xb);
  card.appendChild(ub);

  // Swipe left to reject
  let sx=0, sy=0, swipe=false, cx=0;
  card.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    swipe = false; cx = 0;
    card.style.transition = 'none';
  }, {passive:true});
  card.addEventListener('touchmove', function(e){
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (!swipe) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) swipe = true;
      else if (Math.abs(dy) > 8) return; // vertical scroll wins
    }
    if (swipe) {
      e.preventDefault();
      cx = Math.min(0, dx); // left only
      card.style.transform = 'translateX(' + cx + 'px)';
    }
  }, {passive:false});
  card.addEventListener('touchend', function(){
    card.style.transition = '';
    if (swipe && cx < -60) { rejectPin(pin.pin_key); }
    else { card.style.transform = ''; }
    swipe = false;
  });

  wrap.appendChild(card);
  return wrap;
}

// ── Reject / undo ─────────────────────────────────────────────────────────────
function rejectPin(key) {
  if (rejected.has(key) || confirmed) return;

  // If another card has pending undo, collapse it immediately
  if (undoTimer) {
    clearTimeout(undoTimer);
    if (undoKey && undoKey !== key) collapseCard(undoKey);
    undoTimer = null;
  }

  rejected.add(key);
  undoKey = key;
  updateCounter();

  const card = document.getElementById('c-' + esc(key));
  const ub   = document.getElementById('u-' + esc(key));
  if (card) { card.style.transform = ''; card.classList.add('rj-pending'); }
  if (ub)   ub.classList.add('show');

  undoTimer = setTimeout(function(){
    collapseCard(key);
    undoKey = null; undoTimer = null;
  }, 3500);
}

function undoReject(key) {
  if (!rejected.has(key)) return;
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  rejected.delete(key);
  undoKey = null;
  const card = document.getElementById('c-' + esc(key));
  const ub   = document.getElementById('u-' + esc(key));
  if (card) { card.classList.remove('rj-pending'); card.style.transform = ''; }
  if (ub)   ub.classList.remove('show');
  updateCounter();
}

function collapseCard(key) {
  const wrap = document.getElementById('w-' + esc(key));
  if (wrap) { wrap.style.height = '0'; wrap.style.opacity = '0'; }
  // Write rejected status to Firebase immediately — don't wait for Done button
  if (rejected.has(key) && !writtenFb.has(key)) {
    writtenFb.add(key);
    const pin    = ALL_PINS.find(function(p){ return p.pin_key === key; });
    const domKey = key.replace(/\./g, '_');
    const path   = 'pin_pricing_tests/' + TEST_RUN_ID + '/' + APPROACH_ID + '/pins/' + domKey;
    _fbPatch(path, {
      auto_match_review:      'rejected',
      auto_match_score:       pin ? pin.auto_sim : null,
      auto_match_reviewed_at: Date.now(),
      auto_match_original:    true,
      reviewed_by:            _getUser(),
      match_status:           'no_match'
    });
  }
}

// ── Counter ───────────────────────────────────────────────────────────────────
function updateCounter() {
  const rem = ALL_PINS.length - rejected.size;
  document.getElementById('hdr-count').textContent = rem + ' / ' + ALL_PINS.length;
  document.getElementById('cc').textContent = rem;
}

// ── Sort ──────────────────────────────────────────────────────────────────────
function setSort(el, mode) {
  sortMode = mode;
  document.querySelectorAll('.s-pill').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  render();
}

// ── Hamburger ─────────────────────────────────────────────────────────────────
function toggleMenu() {
  document.getElementById('menu-dd').classList.toggle('open');
}
document.addEventListener('click', function(e){
  if (!e.target.closest('#menu-btn') && !e.target.closest('#menu-dd')) {
    document.getElementById('menu-dd').classList.remove('open');
  }
});

// ── Confirm all ───────────────────────────────────────────────────────────────
async function confirmAll() {
  if (confirmed) return;
  const rem = ALL_PINS.length - rejected.size;
  if (rem === 0 && rejected.size === 0) return;

  confirmed = true;

  // Flush any pending undo collapse immediately
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  if (undoKey)   { collapseCard(undoKey); undoKey = null; }

  const btn = document.getElementById('confirm-btn');
  btn.className = 'saving';
  btn.textContent = 'Saving…';

  const now      = Date.now();
  const reviewer = _getUser();
  const pinsBase = 'pin_pricing_tests/' + TEST_RUN_ID + '/' + APPROACH_ID + '/pins';
  const writes   = {};
  for (const pin of ALL_PINS) {
    if (writtenFb.has(pin.pin_key)) continue; // already written as rejected during this session
    const isRej  = rejected.has(pin.pin_key);
    const domKey = pin.pin_key.replace(/\./g, '_');
    writes[domKey] = {
      auto_match_review:      isRej ? 'rejected' : 'confirmed',
      auto_match_score:       pin.auto_sim,
      auto_match_reviewed_at: now,
      auto_match_original:    true,
      reviewed_by:            reviewer
    };
    if (isRej) writes[domKey].match_status = 'no_match';
  }
  if (Object.keys(writes).length > 0) {
    await _fbPatch(pinsBase, writes);
  }

  document.getElementById('list').style.display = 'none';
  document.getElementById('sort-bar').style.display = 'none';
  const doneEl = document.getElementById('done-msg');
  doneEl.style.display = 'block';
  doneEl.innerHTML = (
    '<p style="font-size:28px;margin-bottom:16px">&#10003;</p>' +
    '<p><strong>' + rem + ' match' + (rem === 1 ? '' : 'es') + ' confirmed.</strong></p>' +
    (rejected.size > 0
      ? '<p style="margin-top:8px;color:#aaa">' + rejected.size + ' pin' +
        (rejected.size === 1 ? '' : 's') + ' sent to ClickToPrice (no-match).</p>'
      : '') +
    '<p style="margin-top:24px"><a href="index.html" style="color:#6af;font-size:15px">&#8592; Back to Lexi Harness</a></p>'
  );
  btn.className = 'done';
  btn.textContent = '✓ Done';
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
