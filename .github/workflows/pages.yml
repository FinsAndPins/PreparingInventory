name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (root site files only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .nojekyll
            index.html
            pricing_index.json
          sparse-checkout-cone-mode: false

      - name: Sparse-add every PriceCollection testing UI
        run: |
          set -euo pipefail
          added=0
          while IFS= read -r d; do
            for suffix in testing_ui_visual_baseline testing_ui_visual_baseline_with_ctr_clicks; do
              base="${d}/${suffix}"
              if git cat-file -e "HEAD:${base}" 2>/dev/null; then
                git sparse-checkout add "$base"
                added=$((added+1))
              fi
            done
          done < <(git ls-tree --name-only HEAD | grep '^PriceCollection_' || true)
          echo "Sparse-added ${added} testing UI path(s)."

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html pricing_index.json .nojekyll _site/
          for baseline in PriceCollection_*/testing_ui_visual_baseline; do
            if [ -d "$baseline" ]; then
              collection="${baseline%/testing_ui_visual_baseline}"
              mkdir -p "_site/$collection"
              cp -R "$baseline" "_site/$collection/"
            fi
          done
          for with_ctr in PriceCollection_*/testing_ui_visual_baseline_with_ctr_clicks; do
            if [ -d "$with_ctr" ]; then
              collection="${with_ctr%/testing_ui_visual_baseline_with_ctr_clicks}"
              mkdir -p "_site/$collection"
              cp -R "$with_ctr" "_site/$collection/"
            fi
          done
          echo "Site size:" && du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
