name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (root site files only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .nojekyll
            index.html
            pricing_index.json
          sparse-checkout-cone-mode: false

      - name: Sparse-add every PriceCollection testing UI
        run: |
          set -euo pipefail
          added=0
          while IFS= read -r d; do
            for suffix in testing_ui_visual_baseline testing_ui_visual_baseline_with_ctr_clicks testing_ui_visual_baseline_with_live_ctr testing_ui_enhanced testing_ui_vlm_ctm_exp testing_ui_vlm_ctm_exp_v2; do
              base="${d}/${suffix}"
              if git cat-file -e "HEAD:${base}" 2>/dev/null; then
                git sparse-checkout add "$base"
                added=$((added+1))
              fi
            done
          done < <(git ls-tree --name-only HEAD | grep '^PriceCollection_' || true)
          echo "Sparse-added ${added} testing UI path(s)."

      - name: Sparse-add title validator review pages
        run: |
          set -euo pipefail
          added=0
          while IFS= read -r d; do
            git sparse-checkout add "$d"
            added=$((added+1))
          done < <(git ls-tree --name-only HEAD | grep '^title_validator' || true)
          echo "Sparse-added ${added} title_validator path(s)."

      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html pricing_index.json .nojekyll _site/
          for tv in title_validator*; do
            if [ -d "$tv" ]; then
              cp -R "$tv" "_site/"
            fi
          done
          for baseline in PriceCollection_*/testing_ui_visual_baseline; do
            if [ -d "$baseline" ]; then
              collection="${baseline%/testing_ui_visual_baseline}"
              mkdir -p "_site/$collection"
              cp -R "$baseline" "_site/$collection/"
            fi
          done
          for with_ctr in PriceCollection_*/testing_ui_visual_baseline_with_ctr_clicks; do
            if [ -d "$with_ctr" ]; then
              collection="${with_ctr%/testing_ui_visual_baseline_with_ctr_clicks}"
              mkdir -p "_site/$collection"
              cp -R "$with_ctr" "_site/$collection/"
            fi
          done
          for with_live_ctr in PriceCollection_*/testing_ui_visual_baseline_with_live_ctr; do
            if [ -d "$with_live_ctr" ]; then
              collection="${with_live_ctr%/testing_ui_visual_baseline_with_live_ctr}"
              mkdir -p "_site/$collection"
              cp -R "$with_live_ctr" "_site/$collection/"
            fi
          done
          for enhanced in PriceCollection_*/testing_ui_enhanced; do
            if [ -d "$enhanced" ]; then
              collection="${enhanced%/testing_ui_enhanced}"
              mkdir -p "_site/$collection"
              cp -R "$enhanced" "_site/$collection/"
            fi
          done
          for vlm_ctm in PriceCollection_*/testing_ui_vlm_ctm_exp; do
            if [ -d "$vlm_ctm" ]; then
              collection="${vlm_ctm%/testing_ui_vlm_ctm_exp}"
              mkdir -p "_site/$collection"
              cp -R "$vlm_ctm" "_site/$collection/"
            fi
          done
          for vlm_ctm_v2 in PriceCollection_*/testing_ui_vlm_ctm_exp_v2; do
            if [ -d "$vlm_ctm_v2" ]; then
              collection="${vlm_ctm_v2%/testing_ui_vlm_ctm_exp_v2}"
              mkdir -p "_site/$collection"
              cp -R "$vlm_ctm_v2" "_site/$collection/"
            fi
          done
          echo "Site size:" && du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wandalen/wretry.action@v3.4.0
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 45000
