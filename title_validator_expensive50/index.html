const STORAGE_KEY = 'pin_validator_expensive50_20260713_20260720';
let idx = 0;
let results = {};

// Load saved progress
try { results = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}

// Find first unvalidated pin
function firstUnvalidated() {
  for (let i = 0; i < PINS.length; i++) {
    if (!results[PINS[i].pin_key]) return i;
  }
  return 0;
}
idx = firstUnvalidated();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(results)); } catch(e) {}
}

function fieldState(pk, field) {
  return (results[pk] || {})[field] || null;
}

function curPin() { return PINS[idx] || null; }

function updatePreview() {
  const pin = curPin(); if (!pin) return;
  const pk = pin.pin_key;
  const res = results[pk] || {};

  const charVal  = res.char_correction  ?? pin.character;
  const mfrVal   = res.mfr_correction   ?? pin.manufacturer;
  const setVal   = res.set_correction   ?? pin.set;

  const charUse  = (res.char  === 'bad' ? (res.char_correction  ?? '') : charVal).trim();
  const mfrUse   = (res.mfr   === 'bad' ? (res.mfr_correction   ?? '') : mfrVal).trim();
  const setUse   = (res.set   === 'bad' ? (res.set_correction   ?? '') : setVal).trim();

  const parts = [charUse, mfrUse, setUse].filter(Boolean);
  document.getElementById('preview-text').textContent = parts.join(' ') || '(no title)';
}

function renderField(field, value) {
  const pin = curPin(); if (!pin) return;
  const pk = pin.pin_key;
  const res = results[pk] || {};
  const state = res[field];    // 'ok' | 'bad' | undefined
  const correction = res[field + '_correction'] ?? '';

  const valEl  = document.getElementById('fval-' + field);
  const editEl = document.getElementById('fedit-' + field);
  const okBtn  = document.getElementById('fok-'  + field);
  const badBtn = document.getElementById('fbad-' + field);

  valEl.textContent  = value || '(none)';
  valEl.className    = 'fval' + (value ? '' : ' empty') +
                       (state === 'ok' ? ' ok-mark' : state === 'bad' ? ' bad-mark' : '');
  okBtn.className    = 'fbtn fbtn-ok'  + (state === 'ok'  ? ' active' : '');
  badBtn.className   = 'fbtn fbtn-bad' + (state === 'bad' ? ' active' : '');

  editEl.value = correction;
  if (state === 'bad') {
    editEl.classList.add('show');
  } else {
    editEl.classList.remove('show');
  }
}

function showPin(i) {
  const pin = PINS[i]; if (!pin) return;
  const pk = pin.pin_key;

  // Images
  const imgRow = document.getElementById('img-row');
  let imgsHTML = '';
  if (pin.crop_url) {
    imgsHTML += `<div class="img-wrap">
      <img class="pin-img" src="${pin.crop_url}" alt="Pin crop" onerror="this.style.display='none'">
      <span>Our Pin</span>
    </div>`;
  }
  if (pin.thumb_url) {
    imgsHTML += `<div class="img-wrap">
      <img class="ebay-img" src="${pin.thumb_url}" alt="eBay listing">
      <span>eBay Match</span>
      ${pin.ebay_url ? `<a href="${pin.ebay_url}" target="_blank">View on eBay ↗</a>` : ''}
    </div>`;
  }
  // Confidence badge + price
  const confClass = `conf-${pin.confidence || 'none'}`;
  imgsHTML += `<div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <span class="conf-badge ${confClass}">${pin.confidence || 'not extracted'}</span>
    ${pin.price ? `<span style="font-size:13px;color:#6b7280">${pin.price}</span>` : ''}
    <span style="font-size:10px;color:#9ca3af">${pin.run_date}</span>
  </div>`;
  imgRow.innerHTML = imgsHTML;

  // Source title
  document.getElementById('source-text').textContent = pin.listing_title;

  // Fields
  renderField('char', pin.character);
  renderField('mfr',  pin.manufacturer);
  renderField('set',  pin.set);

  // Preview
  updatePreview();

  // Counter
  document.getElementById('pin-counter').textContent =
    `Pin ${i+1} of ${PINS.length} · pin_key: ${pk}`;

  // Progress bar
  const pct = (i / Math.max(PINS.length - 1, 1)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';

  updateStats();
}

function mark(field, state) {
  const pin = curPin(); if (!pin) return;
  const pk = pin.pin_key;
  if (!results[pk]) results[pk] = {};

  // Toggle: clicking same button again clears it
  if (results[pk][field] === state) {
    delete results[pk][field];
    delete results[pk][field + '_correction'];
  } else {
    results[pk][field] = state;
    if (state === 'ok') {
      delete results[pk][field + '_correction'];
    }
  }
  save();
  renderField(field, curPin()[field === 'char' ? 'character' : field === 'mfr' ? 'manufacturer' : 'set']);
  if (state === 'bad') {
    const el = document.getElementById('fedit-' + field);
    el.value = curPin()[field === 'char' ? 'character' : field === 'mfr' ? 'manufacturer' : 'set'] || '';
    el.focus();
    el.select();
  }
  updatePreview();
  updateStats();
  checkAutoAdvance();
}

function saveCorrection(field) {
  const pin = curPin(); if (!pin) return;
  const pk = pin.pin_key;
  const val = document.getElementById('fedit-' + field).value.trim();
  if (!results[pk]) results[pk] = {};
  results[pk][field + '_correction'] = val;
  save();
  updatePreview();
}

// Wire up correction inputs
['char','mfr','set'].forEach(f => {
  const el = document.getElementById('fedit-' + f);
  el.addEventListener('input', () => saveCorrection(f));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); nextField(f); }
  });
});

function nextField(field) {
  const order = ['char','mfr','set'];
  const i = order.indexOf(field);
  if (i < order.length - 1) {
    const next = document.getElementById('fedit-' + order[i+1]);
    if (next.classList.contains('show')) { next.focus(); next.select(); }
  } else {
    checkAutoAdvance();
  }
}

function checkAutoAdvance() {
  const pin = curPin(); if (!pin) return;
  const res = results[pin.pin_key] || {};
  const allDone = ['char','mfr','set'].every(f => res[f] === 'ok' || res[f] === 'bad');
  // Don't auto-advance if a correction field is open and empty
  const corrOpen = ['char','mfr','set'].some(f =>
    res[f] === 'bad' &&
    !(res[f + '_correction'] !== undefined) &&
    document.getElementById('fedit-' + f).value.trim() === '' &&
    document.getElementById('fedit-' + f).classList.contains('show')
  );
  if (allDone && !corrOpen) {
    setTimeout(() => go(1), 250);
  }
}

function allOk() {
  const pin = curPin(); if (!pin) return;
  const pk = pin.pin_key;
  if (!results[pk]) results[pk] = {};
  results[pk].char = 'ok';
  results[pk].mfr  = 'ok';
  results[pk].set  = 'ok';
  delete results[pk].char_correction;
  delete results[pk].mfr_correction;
  delete results[pk].set_correction;
  save();
  updateStats();
  go(1);
}

function skip() { go(1); }

function go(dir) {
  idx = Math.max(0, Math.min(PINS.length - 1, idx + dir));
  showPin(idx);
}

function updateStats() {
  let n=0, cok=0, ctot=0, mok=0, mtot=0, sok=0, stot=0;
  for (const pk of Object.keys(results)) {
    const r = results[pk];
    const hasAny = r.char || r.mfr || r.set;
    if (!hasAny) continue;
    n++;
    if (r.char) { ctot++; if (r.char==='ok') cok++; }
    if (r.mfr)  { mtot++; if (r.mfr==='ok')  mok++; }
    if (r.set)  { stot++; if (r.set==='ok')   sok++; }
  }
  document.getElementById('sn').textContent = n + '/' + PINS.length;

  function pct(ok, tot) {
    if (!tot) return {text:'—', cls:'neutral'};
    const p = Math.round(100*ok/tot);
    return {text: p+'%', cls: p>=90?'good':p>=75?'ok':'bad'};
  }
  const cp = pct(cok,ctot), mp = pct(mok,mtot), sp = pct(sok,stot);
  const sc = document.getElementById('sc'); sc.textContent = cp.text; sc.className = 'stat-val '+cp.cls;
  const sm = document.getElementById('sm'); sm.textContent = mp.text; sm.className = 'stat-val '+mp.cls;
  const ss = document.getElementById('ss'); ss.textContent = sp.text; ss.className = 'stat-val '+sp.cls;
}

function exportResults() {
  const out = {
    exported_at: new Date().toISOString(),
    total_pins: PINS.length,
    validated: 0,
    accuracy: {},
    pins: []
  };
  let cok=0,ctot=0,mok=0,mtot=0,sok=0,stot=0;
  for (const pin of PINS) {
    const r = results[pin.pin_key] || {};
    if (!r.char && !r.mfr && !r.set) continue;
    out.validated++;
    const row = {
      pin_key:       pin.pin_key,
      listing_title: pin.listing_title,
      char_extracted: pin.character, char_ok: r.char, char_correction: r.char_correction,
      mfr_extracted:  pin.manufacturer, mfr_ok: r.mfr, mfr_correction: r.mfr_correction,
      set_extracted:  pin.set, set_ok: r.set, set_correction: r.set_correction,
      final_char: r.char==='bad' ? (r.char_correction??'') : pin.character,
      final_mfr:  r.mfr==='bad'  ? (r.mfr_correction??'')  : pin.manufacturer,
      final_set:  r.set==='bad'  ? (r.set_correction??'')  : pin.set,
      confidence: pin.confidence, price: pin.price,
    };
    out.pins.push(row);
    if (r.char) { ctot++; if(r.char==='ok') cok++; }
    if (r.mfr)  { mtot++; if(r.mfr==='ok')  mok++; }
    if (r.set)  { stot++; if(r.set==='ok')   sok++; }
  }
  out.accuracy = {
    character:    ctot ? Math.round(100*cok/ctot)+'%' : 'n/a',
    manufacturer: mtot ? Math.round(100*mok/mtot)+'%' : 'n/a',
    set:          stot ? Math.round(100*sok/stot)+'%' : 'n/a',
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pin_validator_results_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); allOk(); }
  else if (e.key === '1') { document.getElementById('fedit-char').focus(); }
  else if (e.key === '2') { document.getElementById('fedit-mfr').focus(); }
  else if (e.key === '3') { document.getElementById('fedit-set').focus(); }
  else if (e.key === 's') { skip(); }
});

// Init
showPin(idx);
</script>
