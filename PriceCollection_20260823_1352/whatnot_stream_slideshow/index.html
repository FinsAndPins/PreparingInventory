const INTERVAL_MS = 3000;
let pins = PINS || [];
let idx = 0;
let timer = null;
let paused = false;

const pinImg = document.getElementById('pinImg');
const label = document.getElementById('label');
const meta = document.getElementById('meta');
const counter = document.getElementById('counter');
const errEl = document.getElementById('err');
const btnPause = document.getElementById('btnPause');

function fail(msg) {
  errEl.style.display = 'flex';
  errEl.textContent = msg;
}

function show(i) {
  if (!pins.length) { fail('No pins loaded.'); return; }
  idx = ((i % pins.length) + pins.length) % pins.length;
  const p = pins[idx];
  pinImg.onerror = function() {
    fail('Image missing: ' + (p.file || '?') + '. Copy the whole ipad folder — index.html must sit next to the JPG files.');
  };
  pinImg.onload = function() { errEl.style.display = 'none'; };
  pinImg.src = p.file;
  pinImg.alt = p.crop_id || 'pin';
  label.textContent = p.crop_id || '—';
  meta.textContent = '$' + (p.whatnot_price || '?') + ' · Board ' + (p.board_num || '?') + ' pin ' + (p.pin_n || '?');
  counter.textContent = (idx + 1) + ' / ' + pins.length + ' · every 3s';
}

function tick() {
  if (!paused && pins.length) show(idx + 1);
}

function restartTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(tick, INTERVAL_MS);
}

if (!pins.length) {
  fail('No pins in slideshow. Re-run build_stream_slideshow.py on your Mac.');
} else {
  show(0);
  restartTimer();
}

btnPause.onclick = function() {
  paused = !paused;
  btnPause.textContent = paused ? 'Play' : 'Pause';
};
document.getElementById('btnPrev').onclick = function() { show(idx - 1); restartTimer(); };
document.getElementById('btnNext').onclick = function() { show(idx + 1); restartTimer(); };
pinImg.addEventListener('click', function() { show(idx + 1); restartTimer(); });
</script>
